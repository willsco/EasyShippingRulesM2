name: CI

on:
  push:
  pull_request:

jobs:
  coding-standard:
    name: Magento Coding Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install magento/magento-coding-standard
        run: composer create-project --no-interaction --no-progress magento/magento-coding-standard "$RUNNER_TEMP/mcs"

      - name: PHPCS (errors fail the build, warnings are reported)
        run: >
          "$RUNNER_TEMP/mcs/vendor/bin/phpcs" --standard=Magento2 --extensions=php,phtml,xml
          --ignore=*/i18n/* --runtime-set ignore_warnings_on_exit 1 module

  unit-tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      # Magento packages come from the public Mage-OS mirror, so no repo.magento.com keys are needed.
      - name: Install Magento 2.4.7 packages
        working-directory: ${{ runner.temp }}
        run: |
          mkdir magento && cd magento
          cat > composer.json <<JSON
          {
              "repositories": [{"type": "composer", "url": "https://mirror.mage-os.org/"}],
              "require": {
                  "magento/framework": "103.0.7",
                  "magento/module-sales-rule": "*",
                  "magento/module-shipping": "*",
                  "phpunit/phpunit": "^9.6"
              },
              "autoload": {
                  "psr-4": {"WillSco\\\\EasyShippingRulesM2\\\\": "$GITHUB_WORKSPACE/module/"}
              },
              "config": {"allow-plugins": false}
          }
          JSON
          composer update --no-interaction --no-progress --no-plugins --no-scripts --ignore-platform-req=ext-*
          cat > bootstrap.php <<'PHP'
          <?php
          require __DIR__ . '/vendor/autoload.php';
          require_once __DIR__ . '/vendor/magento/framework/Phrase/__.php';
          // Generates Factory/ExtensionAttributes classes on demand, as Magento's dev/tests/unit does.
          $generatedDir = __DIR__ . '/generated';
          @mkdir($generatedDir, 0777, true);
          $io = new \Magento\Framework\Code\Generator\Io(new \Magento\Framework\Filesystem\Driver\File(), $generatedDir);
          $autoloader = new \Magento\Framework\TestFramework\Unit\Autoloader\GeneratedClassesAutoloader(
              [
                  new \Magento\Framework\TestFramework\Unit\Autoloader\ExtensionAttributesGenerator(),
                  new \Magento\Framework\TestFramework\Unit\Autoloader\ExtensionAttributesInterfaceGenerator(),
                  new \Magento\Framework\TestFramework\Unit\Autoloader\FactoryGenerator(),
              ],
              $io
          );
          spl_autoload_register([$autoloader, 'load']);
          PHP

      - name: PHPUnit
        run: >
          "$RUNNER_TEMP/magento/vendor/bin/phpunit" --bootstrap "$RUNNER_TEMP/magento/bootstrap.php"
          module/Test/Unit

  integration-tests:
    name: Integration tests (Magento 2.4.7)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: magento_integration_tests
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      search:
        image: opensearchproject/opensearch:2.12.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd="curl -fs http://localhost:9200/_cluster/health"
          --health-interval=10s --health-timeout=5s --health-retries=30
    env:
      MAGENTO_VERSION: 2.4.7-p10
      COMPOSER_MEMORY_LIMIT: -1
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, gd, intl, pdo_mysql, soap, sockets, xsl, zip
          ini-values: memory_limit=4G
          tools: composer:v2
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-magento-${{ env.MAGENTO_VERSION }}

      # Same Mage-OS mirror as the E2E environment, so no repo.magento.com keys are needed.
      - name: Install Magento ${{ env.MAGENTO_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          composer create-project --no-install --no-interaction \
            --repository-url=https://mirror.mage-os.org/ "magento/project-community-edition:$MAGENTO_VERSION" magento
          cd magento
          composer config --unset repositories.0 || true
          composer config repositories.mageos composer https://mirror.mage-os.org/
          composer config --no-plugins allow-plugins true
          # Test environment only: older patch releases have published advisories.
          php -r '$f = "composer.json"; $j = json_decode(file_get_contents($f), true);
              $j["config"]["policy"]["advisories"]["block"] = false; $j["config"]["audit"]["block-insecure"] = false;
              file_put_contents($f, json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          composer install --no-interaction --no-progress
          # 2.4.7's esconfig.xsd is rejected by libxml2 >= 2.12 ("content model is not determinist"),
          # which breaks every product save. Use the upstream fix from 2.4-develop.
          cat > vendor/magento/module-elasticsearch/etc/esconfig.xsd <<'XSD'
          <?xml version="1.0" encoding="UTF-8"?>
          <xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">
          <xs:element name="config" type="configType" />
          <xs:complexType name="configType" mixed="true">
              <xs:choice maxOccurs="unbounded" minOccurs="1">
                  <xs:element name="stemmer" type="stemmerDataType" />
                  <xs:element name="stopwords_file" type="stopwordsDataType" />
              </xs:choice>
          </xs:complexType>
          <xs:complexType name="stemmerDataType">
              <xs:sequence>
                  <xs:element type="xs:string" name="type" minOccurs="1" maxOccurs="1"/>
                  <xs:element type="xs:string" name="default" minOccurs="1" maxOccurs="1"/>
                  <xs:any processContents="lax" minOccurs="0" maxOccurs="unbounded"/>
              </xs:sequence>
          </xs:complexType>
          <xs:complexType name="stopwordsDataType">
              <xs:sequence>
                  <xs:element type="xs:string" name="default" minOccurs="1" maxOccurs="1"/>
                  <xs:any processContents="lax" minOccurs="0" maxOccurs="unbounded"/>
              </xs:sequence>
          </xs:complexType>
          </xs:schema>
          XSD
          mkdir -p app/code/WillSco
          cp -a "$GITHUB_WORKSPACE/module" app/code/WillSco/EasyShippingRulesM2

      # The test framework installs Magento with the module into the test database on the first run.
      - name: PHPUnit
        working-directory: ${{ runner.temp }}/magento/dev/tests/integration
        run: |
          cat > etc/install-config-mysql.php <<'PHP'
          <?php
          return [
              'db-host' => '127.0.0.1',
              'db-user' => 'root',
              'db-password' => 'root',
              'db-name' => 'magento_integration_tests',
              'db-prefix' => '',
              'backend-frontname' => 'backend',
              'search-engine' => 'opensearch',
              'opensearch-host' => '127.0.0.1',
              'opensearch-port' => 9200,
              'admin-user' => \Magento\TestFramework\Bootstrap::ADMIN_NAME,
              'admin-password' => \Magento\TestFramework\Bootstrap::ADMIN_PASSWORD,
              'admin-email' => \Magento\TestFramework\Bootstrap::ADMIN_EMAIL,
              'admin-firstname' => \Magento\TestFramework\Bootstrap::ADMIN_FIRSTNAME,
              'admin-lastname' => \Magento\TestFramework\Bootstrap::ADMIN_LASTNAME,
          ];
          PHP
          ../../../vendor/bin/phpunit -c phpunit.xml.dist ../../../app/code/WillSco/EasyShippingRulesM2/Test/Integration
