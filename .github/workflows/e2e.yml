name: E2E

# Installs Magento in Docker and runs the Playwright suite (about 20 minutes).
on:
  workflow_dispatch:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Test/E2E/docker
    steps:
      - uses: actions/checkout@v4

      - name: Start Magento
        run: docker compose up -d --build

      - name: Run Playwright
        run: CI=1 docker compose run --rm playwright

      - name: Magento logs
        if: failure()
        run: docker compose logs magento | tail -200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            Test/E2E/playwright-report
            Test/E2E/test-results
          retention-days: 14
